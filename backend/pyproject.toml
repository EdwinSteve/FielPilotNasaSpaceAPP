[project]
name = "surco-backend"
version = "0.1.0"
description = "API de SURCO: rotaciones de cultivo resilientes con datos de la NASA"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2,<3",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg",
    "alembic>=1.13,<2.0",
    "motor",
    "argon2-cffi",
    "pyjwt",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
