# Configuración de SURCO API. Los secretos llegan por variables de entorno (o backend/.env, ver .env.example).
spring:
  application:
    name: surco-api
  config:
    import:
      # En desarrollo lee backend/.env (formato CLAVE=valor).
      - optional:file:.env[.properties]
      # Con Docker Compose, secretos como archivos: cada archivo es una propiedad (JWT_SECRETO).
      # Las variables de entorno reales tienen prioridad sobre ambos.
      - optional:configtree:${SURCO_SECRETOS:/run/secrets/surco}/
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/surco}
    username: ${DATABASE_USER:surco}
    password: ${DATABASE_PASSWORD:surco}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration); JPA solo valida
      ddl-auto: validate
  jackson:
    # JSON en snake_case: nombre_completo, access_token, expira_en...
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

surco:
  jwt:
    secreto: ${JWT_SECRETO:}
    emisor: surco-api
    audiencia: surco-app
    duracion-acceso: 15m
    duracion-refresco: 30d
  ingreso:
    maximo-intentos: 5
    duracion-bloqueo: 15m
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000}
  # Servidor del planificador estacional (ml/planificador: python -m surco_planificador.servidor)
  planificador:
    url: ${PLANIFICADOR_URL:http://localhost:8090}
    tiempo-maximo: 180s

management:
  endpoints:
    web:
      exposure:
        include: health
