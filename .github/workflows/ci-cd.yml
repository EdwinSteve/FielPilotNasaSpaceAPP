# CI/CD de SURCO.
#
# CI  (todo Pull Request hacia main y todo push a main): backend, frontend y scripts deben pasar.
#     Configure estos tres jobs como "required status checks" de main (ver docs/ci-cd.md).
# CD  (solo push a main, después de que el CI pasa): construye y publica las imágenes Docker
#     en GitHub Container Registry (ghcr.io), listas para desplegar.
#
# Las acciones van fijadas por SHA (no por etiqueta, que se puede mover); Dependabot las actualiza.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un PR con commits nuevos cancela la corrida anterior; en main cada push corre completo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Mínimo privilegio: solo lectura, salvo el job que publica.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · Java 21 + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Base para las pruebas *IT (application-test.yml apunta a localhost:5432/surco_test)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surco
          POSTGRES_PASSWORD: surco
          POSTGRES_DB: surco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar (unitarias, JWT, ArchUnit e integración)
        run: ./mvnw -B -ntp verify
      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend · lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci
      - name: Lint (cero advertencias)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Build de producción
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  scripts:
    name: Scripts · Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Probar el generador de la DIVIPOLA
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q scripts/tests

  publicar:
    name: CD · publicar imagen ${{ matrix.imagen }}
    needs: [backend, frontend, scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: surco-api
            contexto: backend
          - imagen: surco-web
            contexto: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nombre de la imagen en minúsculas (ghcr.io lo exige)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.imagen }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas (sha-<commit> y latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # El frontend dirige /api/v1 al contenedor de la API (nombre de servicio en compose/k8s)
          build-args: |
            BACKEND_URL=http://surco-api:8080
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}
