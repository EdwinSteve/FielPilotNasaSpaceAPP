[project]
name = "surco-planificador"
version = "0.1.0"
description = "SURCO: red neuronal que elige el mejor ciclo productivo con el pronóstico estacional de los próximos meses."
requires-python = ">=3.12,<3.13"
# Núcleo: lo que el backend necesita para servir el modelo en CPU (oráculo, entradas, ONNX).
dependencies = [
    "numpy>=2.3",
    "pyyaml>=6.0.3",
    "onnxruntime>=1.23",
]

[project.optional-dependencies]
# Catálogo agronómico desde MongoDB (surco_agro). Sin esta extra se lee el JSON versionado.
mongo = ["pymongo>=4.10"]
# Descarga de datos: Copernicus CDS (pronósticos estacionales), NetCDF y SoilGrids.
datos = [
    "cdsapi>=0.7.6",
    "xarray>=2025.1",
    "netCDF4>=1.7",
    "rasterio>=1.4",
]
# Entrenamiento en la RTX 5060 Ti: torch viene del índice CUDA 12.8 (Blackwell, sm_120).
entrenamiento = [
    "torch>=2.9",
    "onnx>=1.19",
    "onnxscript>=0.5",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surco_planificador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# N806: nombres como TAW y RAW siguen la notación de FAO-56.
ignore = ["N806", "RUF001", "RUF002", "RUF003"]
